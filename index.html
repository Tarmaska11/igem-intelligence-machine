<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iGEM Intelligence Machine</title>
<meta name="description" content="Search every iGEM team project by idea, chassis organism, molecular technique, biological part, target molecule, result or failure.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="bg-contours" aria-hidden="true"></div>

<header id="topbar">
  <div class="brand" id="brandHome" title="Home">
    <span class="logo">&#10037;</span>
    <span class="wordmark">iGEM <b>Intelligence</b> Machine</span>
  </div>
  <div id="headerSearch" class="header-search"></div>
  <div class="navcluster">
    <button id="filterBtn" class="navlink filter-btn" hidden>Filters</button>
    <button id="customBtn" class="navlink" hidden></button>
  </div>
</header>

<main>
  <aside id="facets" hidden>
    <div class="facets-head">
      <h2>Filters</h2>
      <button id="closeFacets" class="link facets-close" hidden>close</button>
      <button id="clearFilters" class="link">clear all</button>
    </div>
    <div id="facetGroups"></div>
  </aside>
  <div id="facetsScrim" class="facets-scrim" hidden></div>

  <section id="content">
    <div id="hero" class="hero">
      <h1>A search over every <span class="hl-k">iGEM</span> project.</h1>
      <p>Find prior teams by idea, chassis organism, molecular technique, biological
         part, target molecule, result, or failure - across <span class="hl-k" id="heroYears">2008-2025</span>.
         Made with love for future iGEMers! ;3</p>
      <div id="heroSearch" class="hero-search">
        <div class="searchwrap">
          <span class="search-ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input id="q" type="search" autocomplete="off" placeholder="Search ideas, chassis, molecules, techniques - and advance science!">
          <button id="searchBtn" aria-label="search">Search</button>
        </div>
      </div>
      <div id="heroStats" class="hero-stats"></div>
      <section id="blog" class="blog" hidden>
        <div id="blogList" class="blog-list"></div>
        <div id="blogMore" class="blog-more"></div>
      </section>
    </div>

    <div id="activeBar" class="active-bar" hidden>
      <div id="activeChips" class="chips"></div>
      <button id="clearFiltersTop" class="link">clear all</button>
    </div>

    <div id="resultsHead" class="results-head" hidden>
      <span id="resultCount"></span>
      <div class="sortnote" id="sortnote">ranked by relevance</div>
    </div>
    <div id="results" class="results"></div>
    <div id="pager" class="pager" hidden></div>
  </section>

  <section id="customView" hidden>
    <iframe id="customFrame" sandbox="allow-popups allow-popups-to-escape-sandbox" title="Page"></iframe>
  </section>
</main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-bg"></div>
  <div class="drawer-panel" id="drawerPanel"></div>
</div>

<div id="blogReader" class="blog-reader" hidden>
  <div class="reader-bg" aria-hidden="true"></div>
  <article class="reader-panel" id="readerPanel" role="dialog" aria-modal="true"></article>
</div>

<div id="dataNote" class="data-note" hidden></div>

<script src="assets/app.js"></script>
</body>
</html>
